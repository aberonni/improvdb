name: E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Only reads the repository; app-job.yml can't have more than this grants
permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/app-job.yml
    with:
      script: ./scripts/e2e.sh
      artifact-name: playwright-report
      artifact-path: playwright-report/
